name: Test build

# Started by hand (Actions → Test build → Run workflow): builds the Windows installer of any
# branch for testing, without a tag or a release. The file is attached to the run as an artifact.
on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles nsis

      # The app is a Cargo workspace member, so bundles land in the workspace's target folder.
      - uses: actions/upload-artifact@v4
        with:
          name: perihub-windows-test-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
